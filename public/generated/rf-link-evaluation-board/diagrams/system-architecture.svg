<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RF Telemetry System Architecture</title>
  <desc id="desc">Block diagram showing the flight computer, CM5 telemetry supervisor, LR2021 transceiver, dual-band RF front ends, antenna system, ground station, and parallel health and hardware protection paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="34">RF Telemetry System Architecture</text>
  <text x="60" y="94" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">Primary data path across the top; health monitoring and independent protection below.</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="55" y="170" width="210" height="125" rx="18" fill="#111c2d" stroke="#334155" stroke-width="2"/>
    <text x="160" y="214" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="23">Flight Computer</text>
    <text x="160" y="246" text-anchor="middle" fill="#94a3b8" font-size="16">vehicle telemetry</text>
    <text x="160" y="271" text-anchor="middle" fill="#64748b" font-size="14">sensors • state • events</text>

    <line x1="265" y1="232" x2="350" y2="232" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="307" y="216" text-anchor="middle" fill="#64748b" font-size="14">Ethernet</text>

    <rect x="365" y="150" width="250" height="165" rx="18" fill="#111c2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="490" y="198" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="25">CM5 Supervisor</text>
    <text x="490" y="230" text-anchor="middle" fill="#cbd5e1" font-size="16">buffer • prioritize • log</text>
    <text x="490" y="255" text-anchor="middle" fill="#cbd5e1" font-size="16">radio + RF-state control</text>
    <text x="490" y="280" text-anchor="middle" fill="#38bdf8" font-size="15">health interpretation</text>

    <line x1="615" y1="232" x2="700" y2="232" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="657" y="216" text-anchor="middle" fill="#64748b" font-size="14">SPI + GPIO</text>

    <rect x="715" y="170" width="210" height="125" rx="18" fill="#111c2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="820" y="216" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="25">LR2021</text>
    <text x="820" y="247" text-anchor="middle" fill="#94a3b8" font-size="16">LoRa transceiver</text>
    <text x="820" y="272" text-anchor="middle" fill="#38bdf8" font-size="15">915 MHz + 2.4 GHz</text>

    <path d="M925 210 H985 V160 H1045" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M925 255 H985 V315 H1045" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1060" y="115" width="255" height="105" rx="18" fill="#111c2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="1188" y="154" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="22">915 MHz RF Front End</text>
    <text x="1188" y="184" text-anchor="middle" fill="#94a3b8" font-size="15">PA/LNA • filters • coupler</text>
    <text x="1188" y="206" text-anchor="middle" fill="#38bdf8" font-size="14">T/R + diversity</text>

    <rect x="1060" y="270" width="255" height="105" rx="18" fill="#111c2d" stroke="#f59e0b" stroke-width="2"/>
    <text x="1188" y="309" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="22">2.4 GHz RF Front End</text>
    <text x="1188" y="339" text-anchor="middle" fill="#94a3b8" font-size="15">PA/LNA • filters • coupler</text>
    <text x="1188" y="361" text-anchor="middle" fill="#f59e0b" font-size="14">T/R + diversity</text>

    <rect x="1112" y="430" width="150" height="78" rx="16" fill="#0f1a2a" stroke="#475569" stroke-width="2"/>
    <text x="1187" y="462" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="19">Antennas</text>
    <text x="1187" y="488" text-anchor="middle" fill="#94a3b8" font-size="14">selected path</text>

    <path d="M1188 220 V420" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1188 375 V420" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1112" y="570" width="150" height="78" rx="16" fill="#0f1a2a" stroke="#475569" stroke-width="2"/>
    <text x="1187" y="602" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="19">Ground Station</text>
    <text x="1187" y="628" text-anchor="middle" fill="#94a3b8" font-size="14">RF link</text>
    <line x1="1187" y1="508" x2="1187" y2="560" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="365" y="430" width="250" height="120" rx="18" fill="#101a29" stroke="#334155" stroke-width="2"/>
    <text x="490" y="470" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="22">Health Telemetry</text>
    <text x="490" y="500" text-anchor="middle" fill="#94a3b8" font-size="15">FWD/REV RF • I/V • temperature</text>
    <text x="490" y="526" text-anchor="middle" fill="#38bdf8" font-size="14">ADC / digital monitors</text>

    <path d="M490 430 V325" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M1060 190 H980 V490 H625" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
    <path d="M1060 335 H1015 V515 H625" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>

    <rect x="55" y="430" width="225" height="120" rx="18" fill="#101a29" stroke="#f59e0b" stroke-width="2"/>
    <text x="167" y="470" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="22">HW Protection</text>
    <text x="167" y="500" text-anchor="middle" fill="#94a3b8" font-size="15">comparators • eFuse • gating</text>
    <text x="167" y="526" text-anchor="middle" fill="#f59e0b" font-size="14">independent shutdown authority</text>

    <path d="M280 490 H350" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M167 430 V350 H1040" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 7"/>
    <path d="M1040 350 V167 H1050" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <text x="60" y="670" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Design intent: software supervises the link; hardware retains authority to force unsafe RF states off.</text>
</svg>
